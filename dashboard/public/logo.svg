<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Chip body -->
  <rect x="36" y="10" width="28" height="28" rx="5" ry="5" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- Brain icon (simplified) -->
  <ellipse cx="50" cy="24" rx="7" ry="6" fill="#e879f9" opacity="0.9"/>
  <line x1="50" y1="18" x2="50" y2="30" stroke="#4c1d95" stroke-width="1"/>
  <path d="M43 22 Q46 19 50 21" fill="none" stroke="#4c1d95" stroke-width="0.8"/>
  <path d="M57 22 Q54 19 50 21" fill="none" stroke="#4c1d95" stroke-width="0.8"/>
  <!-- Chip pins -->
  <line x1="36" y1="17" x2="30" y2="17" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="24" x2="30" y2="24" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="17" x2="70" y2="17" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="24" x2="70" y2="24" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43" y1="38" x2="43" y2="44" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="57" y1="38" x2="57" y2="44" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Platform base -->
  <ellipse cx="50" cy="80" rx="28" ry="5" fill="#3b0764" opacity="0.6"/>
  <rect x="22" y="72" width="56" height="8" rx="3" fill="#4c1d95"/>

  <!-- Bar chart -->
  <rect x="28" y="60" width="10" height="12" rx="2" fill="url(#bar1)" filter="url(#glow)"/>
  <rect x="41" y="52" width="10" height="20" rx="2" fill="url(#bar2)" filter="url(#glow)"/>
  <rect x="54" y="44" width="10" height="28" rx="2" fill="url(#bar3)" filter="url(#glow)"/>

  <!-- Upward arrow -->
  <path d="M30 68 Q50 50 72 30" fill="none" stroke="url(#arrow)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="72,30 65,32 70,37" fill="#f472b6" filter="url(#glow)"/>

  <!-- Sparkles -->
  <circle cx="78" cy="42" r="2" fill="#f9a8d4" opacity="0.9"/>
  <circle cx="22" cy="55" r="1.5" fill="#93c5fd" opacity="0.8"/>
  <circle cx="82" cy="60" r="1.2" fill="#e879f9" opacity="0.7"/>

  <!-- Glow bottom -->
  <ellipse cx="50" cy="85" rx="20" ry="4" fill="#7c3aed" opacity="0.4"/>
</svg>
